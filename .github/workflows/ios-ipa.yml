name: iOS IPA
on:
  push:
    tags: ['v*.*.*']
permissions:
  contents: write
jobs:
  ipa:
    runs-on: macos-26
    defaults:
      run:
        working-directory: apps/house-capture
    steps:
      - uses: actions/checkout@v4
      # The app uses iOS 26 APIs, so take the newest Xcode on the runner.
      - run: sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)" && xcodebuild -version
      - run: brew install xcodegen && xcodegen generate
      # Unsigned: the IPA is signed on the device side with a personal Apple ID.
      - run: |
          xcodebuild -project HouseCapture.xcodeproj -scheme HouseCapture -configuration Release \
            -destination 'generic/platform=iOS' -derivedDataPath build \
            MARKETING_VERSION="${GITHUB_REF_NAME#v}" CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
      - run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/HouseCapture.app Payload/
          zip -qry "HouseCapture-$GITHUB_REF_NAME.ipa" Payload
      - run: gh release create "$GITHUB_REF_NAME" "HouseCapture-$GITHUB_REF_NAME.ipa" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
